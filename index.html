<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark OLED Converter</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #00d2ff;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-color);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            max-width: 800px;
            width: 100%;
            border: 1px solid var(--border-color);
        }

        h1 { margin-top: 0; color: var(--accent-color); font-size: 1.5rem; }
        p { color: #aaa; font-size: 0.9rem; }

        /* File Input Styling */
        input[type="file"] {
            background: #2b2b2b;
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
            color: white;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        /* Canvas Preview */
        .preview-area {
            margin: 20px 0;
            text-align: center;
            background: #000;
            padding: 10px;
            border: 2px solid var(--accent-color);
            display: inline-block;
            border-radius: 4px;
        }
        
        canvas { 
            display: block; 
            image-rendering: pixelated; /* Agar pixel terlihat tajam */
        }

        /* Slider */
        .controls { margin: 20px 0; background: #252525; padding: 15px; border-radius: 8px; }
        input[type="range"] { width: 100%; accent-color: var(--accent-color); }

        /* Button */
        button {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: 0.2s;
        }
        button:hover { background-color: #00a8cc; }

        /* Output Box */
        textarea {
            width: 100%;
            height: 250px;
            margin-top: 20px;
            background-color: #0f0f0f;
            color: #00ff9d; /* Warna teks hacker */
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>OLED Image Converter (Pro)</h1>
    <p>Upload gambar. Web ini akan otomatis resize (max 128x32) tanpa merusak rasio, lalu convert ke kode C++.</p>

    <input type="file" id="uploadInput" accept="image/*">

    <div style="text-align: center;">
        <div class="preview-area">
            <canvas id="previewCanvas"></canvas>
        </div>
        <p id="dimInfo">Ukuran: 0 x 0 px</p>
    </div>

    <div class="controls">
        <label>Threshold (Gelap/Terang): <span id="threshVal">128</span></label>
        <br>
        <input type="range" id="threshold" min="0" max="255" value="128">
    </div>

    <button onclick="processAndGenerate()">Generate Code</button>

    <textarea id="outputCode" readonly placeholder="Klik 'Generate Code' untuk melihat hasil..."></textarea>
</div>

<script>
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const input = document.getElementById('uploadInput');
    const thresholdSlider = document.getElementById('threshold');
    const dimInfo = document.getElementById('dimInfo');
    
    let originalImage = null;
    let finalWidth = 0;
    let finalHeight = 0;

    // Batas Maksimal Layar OLED SSD1306
    const MAX_WIDTH = 128;
    const MAX_HEIGHT = 32;

    input.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;
        
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                originalImage = img;
                calculateDimensions();
                drawPreview(); 
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    thresholdSlider.addEventListener('input', function() {
        document.getElementById('threshVal').innerText = this.value;
        drawPreview();
    });

    // 1. Hitung Dimensi Baru (Keep Aspect Ratio)
    function calculateDimensions() {
        if (!originalImage) return;

        const ratio = Math.min(MAX_WIDTH / originalImage.width, MAX_HEIGHT / originalImage.height);
        
        // Memastikan tidak membesar-besarkan gambar kecil, tapi menyesuaikan gambar besar
        // Kalau mau gambar kecil tetap kecil, hapus Math.min(..., 1)
        // Disini kita paksa fit ke dalam kotak 128x32
        
        finalWidth = Math.floor(originalImage.width * ratio);
        finalHeight = Math.floor(originalImage.height * ratio);

        // Update ukuran canvas
        canvas.width = finalWidth;
        canvas.height = finalHeight;
        dimInfo.innerText = `Ukuran Final: ${finalWidth} x ${finalHeight} px`;
    }

    // 2. Gambar Preview (Hitam Putih)
    function drawPreview() {
        if (!originalImage) return;

        // Gambar original yang sudah di-resize
        ctx.drawImage(originalImage, 0, 0, finalWidth, finalHeight);

        const imageData = ctx.getImageData(0, 0, finalWidth, finalHeight);
        const data = imageData.data;
        const limit = parseInt(thresholdSlider.value);

        for (let i = 0; i < data.length; i += 4) {
            const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
            // Jika lebih terang dari limit -> Putih (Nyala)
            // Jika lebih gelap -> Hitam (Mati)
            const color = avg > limit ? 255 : 0;
            
            data[i] = color;     // R
            data[i+1] = color;   // G
            data[i+2] = color;   // B
            data[i+3] = 255;     // Alpha (Full Opaque)
        }
        ctx.putImageData(imageData, 0, 0);
    }

    // 3. Generate Kode C++
    function processAndGenerate() {
        if(!originalImage) { alert("Upload gambar dulu bos!"); return; }

        const imageData = ctx.getImageData(0, 0, finalWidth, finalHeight);
        const data = imageData.data;
        
        // Header
        let output = `// Masukkan kode ini di atas void setup()\n`;
        output += `#define LOGO_WIDTH  ${finalWidth}\n`;
        output += `#define LOGO_HEIGHT ${finalHeight}\n`;
        output += `static const unsigned char PROGMEM logo_bmp[] = {\n`;

        let hexString = "";
        let count = 0;

        // Loop Pixel untuk konversi ke Hex Array
        // SSD1306 library membaca: baris per baris (horizontal), 8 pixel per byte.
        for (let y = 0; y < finalHeight; y++) {
            for (let x = 0; x < finalWidth; x += 8) {
                let byte = 0;
                
                // Ambil 8 pixel ke samping untuk dijadikan 1 byte
                for (let b = 0; b < 8; b++) {
                    const currentX = x + b;
                    if (currentX < finalWidth) {
                        const pixelIndex = (y * finalWidth + currentX) * 4;
                        const brightness = data[pixelIndex]; // Ambil R saja cukup
                        
                        if (brightness > 128) {
                            // Jika Putih, set bit menjadi 1
                            byte |= (0x80 >> b);
                        }
                    }
                }

                // Format ke Hex (0x00)
                hexString += "0x" + byte.toString(16).toUpperCase().padStart(2, '0') + ", ";
                count++;
                
                // Enter setiap 12 byte agar rapi dilihat
                if (count % 12 === 0) hexString += "\n  "; 
            }
        }

        output += "  " + hexString;
        output += "\n};";

        document.getElementById('outputCode').value = output;
    }
</script>

</body>
</html>
